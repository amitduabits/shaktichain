name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "v2g-marketplace/frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: v2g-marketplace/frontend/package-lock.json
      - name: Build public demo
        working-directory: v2g-marketplace/frontend
        env:
          VITE_DEMO_ONLY: "true"
          VITE_ENABLE_LIVE_MODE: "false"
          VITE_BASE: "/shaktichain/demo/"
        run: |
          npm ci
          npm run build
          mkdir -p ../../website/demo
          cp -r dist/. ../../website/demo/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
