name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  compose-test-matrix:
    name: Full Compose Test Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run full containerized test matrix
        run: |
          docker compose \
            --env-file docker/.env.dev.example \
            --profile test up \
            --build \
            --abort-on-container-exit \
            --exit-code-from all-tests-pass \
            all-tests-pass

      - name: Compose service status
        if: always()
        run: |
          docker compose --env-file docker/.env.dev.example --profile test ps -a

      - name: Capture compose logs
        if: always()
        run: |
          mkdir -p artifacts/compose-logs
          docker compose --env-file docker/.env.dev.example --profile test logs --no-color > artifacts/compose-logs/test-profile.log || true

      - name: Upload compose logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-test-logs
          path: artifacts/compose-logs/
          retention-days: 14

      - name: Tear down test stack
        if: always()
        run: |
          docker compose --env-file docker/.env.dev.example --profile test down -v --remove-orphans
