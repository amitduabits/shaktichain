# DISCOM Fixed Tariff Baseline Configuration
# Based on Delhi BSES Yamuna tariff structure

baseline:
  name: "discom_fixed_tariff"
  description: "Indian DISCOM time-of-use tariff structure"

# Delhi BSES rates (INR/kWh)
tariff_structure:
  bses_delhi:
    residential:
      slab_1:  # 0-200 units
        rate: 3.0
      slab_2:  # 201-400 units
        rate: 4.5
      slab_3:  # 401-800 units
        rate: 6.5
      slab_4:  # 800+ units
        rate: 7.5

    time_of_use:
      enabled: true
      peak:
        hours: [14, 15, 16, 17]
        multiplier: 1.5
      off_peak:
        hours: [22, 23, 0, 1, 2, 3, 4, 5]
        multiplier: 0.8

  tata_mumbai:
    residential:
      flat_rate: 4.5
    time_of_use:
      enabled: true
      peak:
        hours: [18, 19, 20, 21]
        multiplier: 1.3
      off_peak:
        hours: [0, 1, 2, 3, 4, 5, 6]
        multiplier: 0.75

# Feed-in tariff for V2G
feed_in_tariff:
  enabled: true
  rate: 3.0  # INR/kWh
  cap_kwh_per_day: 50
  time_restrictions:
    allowed_hours: [14, 15, 16, 17, 18, 19]

# Fixed charges
fixed_charges:
  monthly_fee: 150  # INR
  demand_charge_per_kw: 100
