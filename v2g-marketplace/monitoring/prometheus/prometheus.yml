# Prometheus configuration for V2G Marketplace
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'v2g-marketplace'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Rule files (optional)
# rule_files:
#   - "alert_rules.yml"

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: /metrics

  # V2G Marketplace Backend
  - job_name: 'v2g-backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 5s
    # Add labels to identify the service
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'v2g-backend'

  # Docker metrics (if docker daemon exposes metrics)
  # - job_name: 'docker'
  #   static_configs:
  #     - targets: ['docker:9323']
