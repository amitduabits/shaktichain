services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: v2g-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:///data/v2g.db
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - v2g-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: v2g-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - v2g-network

networks:
  v2g-network:
    driver: bridge

volumes:
  v2g-data:
    driver: local
