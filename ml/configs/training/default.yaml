# Training Configuration
training:
  # Optimizer
  optimizer:
    type: "adam"
    lr: 0.001
    weight_decay: 0.0001
    betas: [0.9, 0.999]
    eps: 1.0e-8

  # Learning rate scheduler
  scheduler:
    type: "reduce_on_plateau"  # reduce_on_plateau, cosine, step
    mode: "min"
    factor: 0.5
    patience: 5
    min_lr: 1.0e-6
    verbose: true

  # Loss function
  loss:
    type: "mse"  # mse, mae, huber, quantile
    reduction: "mean"

  # Metrics
  metrics:
    - "mae"
    - "rmse"
    - "mape"
    - "r2"

  # Training settings
  epochs: 100
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  check_val_every_n_epoch: 1

  # Early stopping
  early_stopping:
    enabled: true
    monitor: "val_loss"
    patience: 10
    mode: "min"
    min_delta: 0.0001

  # Checkpointing
  checkpoint:
    monitor: "val_loss"
    mode: "min"
    save_top_k: 3
    save_last: true
    filename: "epoch={epoch:02d}-val_loss={val_loss:.4f}"

  # Hardware
  accelerator: "auto"  # auto, cpu, gpu, tpu
  devices: 1
  precision: 32  # 16, 32, 64
  deterministic: true
  benchmark: false

  # Debugging
  fast_dev_run: false
  overfit_batches: 0
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  limit_test_batches: 1.0

  # Profiling
  profiler: null  # null, simple, advanced
