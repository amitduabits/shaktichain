# Logging Configuration
logging:
  # MLflow settings
  mlflow:
    tracking_uri: ${paths.mlflow_uri}
    experiment_name: ${experiment.name}
    run_name: ${experiment.run_name}
    log_model: true
    log_artifacts: true
    artifact_location: null  # Use default

  # TensorBoard settings
  tensorboard:
    enabled: true
    save_dir: ${paths.logs_dir}/tensorboard
    name: ${experiment.run_name}
    version: null

  # Console logging
  console:
    level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

  # File logging
  file:
    enabled: true
    level: "DEBUG"
    path: ${paths.logs_dir}/app.log
    max_bytes: 10485760  # 10MB
    backup_count: 5

  # What to log
  log_hyperparameters: true
  log_metrics_every_n_steps: 10
  log_model_architecture: true
  log_gradients: false
  log_weights: false
