---
# Redis deployment for ML inference caching
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shakti-ml-redis
  namespace: shakti-chain
  labels:
    app: shakti-ml-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shakti-ml-redis
  template:
    metadata:
      labels:
        app: shakti-ml-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          command:
            - redis-server
            - --maxmemory
            - "1gb"
            - --maxmemory-policy
            - "allkeys-lru"
            - --save
            - ""
            - --appendonly
            - "no"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1.5Gi"
              cpu: "500m"
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: shakti-ml-redis
  namespace: shakti-chain
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: shakti-ml-redis

---
# Secret for Redis URL
apiVersion: v1
kind: Secret
metadata:
  name: shakti-ml-secrets
  namespace: shakti-chain
type: Opaque
stringData:
  redis-url: "redis://shakti-ml-redis:6379/0"
