# Prometheus configuration for SHAKTI-CHAIN ML Service

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'development'
    service: 'shakti-ml'

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# Rule files
rule_files:
  - /etc/prometheus/alerts/*.yml

# Scrape configurations
scrape_configs:
  # ML Service metrics
  - job_name: 'ml-service'
    static_configs:
      - targets: ['ml-service:8000']
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 5s

  # Redis metrics (requires redis_exporter)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    metrics_path: /metrics

  # MLflow metrics
  - job_name: 'mlflow'
    static_configs:
      - targets: ['mlflow:5000']
    metrics_path: /metrics

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

# Recording rules for common aggregations
recording_rules:
  groups:
    - name: ml_service_rules
      rules:
        # Request rate
        - record: ml_service:request_rate:5m
          expr: rate(ml_service_requests_total[5m])

        # Error rate
        - record: ml_service:error_rate:5m
          expr: rate(ml_service_requests_total{status=~"5.."}[5m]) / rate(ml_service_requests_total[5m])

        # P99 latency
        - record: ml_service:latency_p99:5m
          expr: histogram_quantile(0.99, rate(ml_service_request_latency_seconds_bucket[5m]))

        # P95 latency
        - record: ml_service:latency_p95:5m
          expr: histogram_quantile(0.95, rate(ml_service_request_latency_seconds_bucket[5m]))

        # Anomaly detection rate
        - record: ml_service:anomaly_rate:1h
          expr: rate(anomaly_alerts_total[1h])
