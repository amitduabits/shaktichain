global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000", "backend-dev:8000", "backend-test-api:8000"]

  - job_name: ml-service
    metrics_path: /metrics
    static_configs:
      - targets: ["ml-service:8000", "ml-service-dev:8000"]

  - job_name: graph-node
    static_configs:
      - targets: ["graph-node:8040"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
