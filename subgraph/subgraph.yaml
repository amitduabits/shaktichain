specVersion: 0.0.5
schema:
  file: ./schema.graphql
description: SHAKTI-CHAIN V2G Energy Trading Platform Subgraph
repository: https://github.com/shakti-chain/subgraph

dataSources:
  - kind: ethereum/contract
    name: ShaktiToken
    network: polygon
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: ShaktiToken
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - TokenHolder
        - Transfer
        - Protocol
        - DailyStats
      abis:
        - name: ShaktiToken
          file: ./abis/ShaktiToken.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
        - event: Approval(indexed address,indexed address,uint256)
          handler: handleApproval
        - event: FeesBurned(indexed address,uint256,uint256)
          handler: handleFeesBurned
      file: ./src/shakti-token.ts
