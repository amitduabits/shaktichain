specVersion: 0.0.5
schema:
  file: ./schema.graphql
description: SHAKTI-CHAIN V2G Energy Trading Platform Subgraph
repository: https://github.com/shakti-chain/subgraph

dataSources:
  # ============ ShaktiToken ============
  - kind: ethereum/contract
    name: ShaktiToken
    network: polygon
    source:
      address: "0x0000000000000000000000000000000000000000" # Replace with deployed address
      abi: ShaktiToken
      startBlock: 0 # Replace with deployment block
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - TokenHolder
        - Transfer
        - Protocol
        - DailyStats
      abis:
        - name: ShaktiToken
          file: ./abis/ShaktiToken.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
        - event: Approval(indexed address,indexed address,uint256)
          handler: handleApproval
        - event: FeesBurned(indexed address,uint256,uint256)
          handler: handleFeesBurned
        - event: DelegateChanged(indexed address,indexed address,indexed address)
          handler: handleDelegateChanged
        - event: DelegateVotesChanged(indexed address,uint256,uint256)
          handler: handleDelegateVotesChanged
      file: ./src/shakti-token.ts

  # ============ EnergyAuction ============
  - kind: ethereum/contract
    name: EnergyAuction
    network: polygon
    source:
      address: "0x0000000000000000000000000000000000000000" # Replace with deployed address
      abi: EnergyAuction
      startBlock: 0 # Replace with deployment block
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - AuctionRound
        - Order
        - Trade
        - Prosumer
        - DailyStats
        - HourlyStats
        - PriceCandle
      abis:
        - name: EnergyAuction
          file: ./abis/EnergyAuction.json
        - name: ShaktiToken
          file: ./abis/ShaktiToken.json
      eventHandlers:
        - event: AuctionRoundCreated(indexed uint256,uint256,uint256,uint256)
          handler: handleAuctionRoundCreated
        - event: AuctionRoundClosed(indexed uint256,uint256,uint256)
          handler: handleAuctionRoundClosed
        - event: AuctionCleared(indexed uint256,uint128,uint256,uint256)
          handler: handleAuctionCleared
        - event: AuctionSettled(indexed uint256)
          handler: handleAuctionSettled
        - event: BidSubmitted(indexed uint256,indexed uint256,indexed address,uint256,uint256)
          handler: handleBidSubmitted
        - event: AskSubmitted(indexed uint256,indexed uint256,indexed address,uint256,uint256)
          handler: handleAskSubmitted
        - event: OrderCancelled(indexed uint256,indexed uint256,indexed address)
          handler: handleOrderCancelled
        - event: OrderMatched(indexed uint256,indexed uint256,indexed address,uint256,uint256,bool)
          handler: handleOrderMatched
        - event: BatchBidsSubmitted(indexed uint256,indexed address,uint256)
          handler: handleBatchBidsSubmitted
        - event: BatchAsksSubmitted(indexed uint256,indexed address,uint256)
          handler: handleBatchAsksSubmitted
      file: ./src/energy-auction.ts

  # ============ EnergyEscrow ============
  - kind: ethereum/contract
    name: EnergyEscrow
    network: polygon
    source:
      address: "0x0000000000000000000000000000000000000000" # Replace with deployed address
      abi: EnergyEscrow
      startBlock: 0 # Replace with deployment block
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Settlement
        - Dispute
        - Trade
        - Prosumer
        - DailyStats
      abis:
        - name: EnergyEscrow
          file: ./abis/EnergyEscrow.json
        - name: ShaktiToken
          file: ./abis/ShaktiToken.json
      eventHandlers:
        - event: Deposited(indexed uint256,indexed address,uint256)
          handler: handleDeposited
        - event: Withdrawn(indexed uint256,indexed address,uint256)
          handler: handleWithdrawn
        - event: SettlementCreated(indexed uint256,indexed uint256,indexed address,address,uint256,uint256,uint256)
          handler: handleSettlementCreated
        - event: SettlementCompleted(indexed uint256,indexed address,uint256,uint256,uint256)
          handler: handleSettlementCompleted
        - event: Refunded(indexed uint256,indexed address,uint256)
          handler: handleRefunded
        - event: DisputeRaised(indexed uint256,indexed address,string)
          handler: handleDisputeRaised
        - event: DisputeResolved(indexed uint256,uint8,string)
          handler: handleDisputeResolved
        - event: Slashed(indexed address,uint256,string)
          handler: handleSlashed
      file: ./src/energy-escrow.ts

  # ============ StakingPool ============
  - kind: ethereum/contract
    name: StakingPool
    network: polygon
    source:
      address: "0x0000000000000000000000000000000000000000" # Replace with deployed address
      abi: StakingPool
      startBlock: 0 # Replace with deployment block
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Stake
        - Prosumer
        - StakingPoolSnapshot
        - Protocol
        - DailyStats
      abis:
        - name: StakingPool
          file: ./abis/StakingPool.json
        - name: ShaktiToken
          file: ./abis/ShaktiToken.json
      eventHandlers:
        - event: Staked(indexed address,uint256,uint256)
          handler: handleStaked
        - event: Unstaked(indexed address,uint256,uint256)
          handler: handleUnstaked
        - event: RewardsClaimed(indexed address,uint256)
          handler: handleRewardsClaimed
        - event: RewardsDistributed(uint256,uint256)
          handler: handleRewardsDistributed
        - event: EmergencyWithdraw(indexed address,uint256)
          handler: handleEmergencyWithdraw
      file: ./src/staking-pool.ts

  # ============ ReputationSystem ============
  - kind: ethereum/contract
    name: ReputationSystem
    network: polygon
    source:
      address: "0x0000000000000000000000000000000000000000" # Replace with deployed address
      abi: ReputationSystem
      startBlock: 0 # Replace with deployment block
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Prosumer
        - ReputationChange
        - DailyStats
      abis:
        - name: ReputationSystem
          file: ./abis/ReputationSystem.json
      eventHandlers:
        - event: UserRegistered(indexed address,uint256,uint8)
          handler: handleUserRegistered
        - event: ReputationUpdated(indexed address,uint256,uint256,string)
          handler: handleReputationUpdated
        - event: TierChanged(indexed address,uint8,uint8)
          handler: handleTierChanged
        - event: DecayApplied(indexed address,uint256,uint256)
          handler: handleDecayApplied
        - event: UserFlaggedEvent(indexed address,indexed address,string)
          handler: handleUserFlagged
        - event: UserUnflagged(indexed address,indexed address)
          handler: handleUserUnflagged
        - event: StakeUpdated(indexed address,uint256,uint256)
          handler: handleStakeUpdated
        - event: KYCStatusUpdated(indexed address,bool)
          handler: handleKYCStatusUpdated
      file: ./src/reputation.ts

  # ============ EnergyRegistry ============
  - kind: ethereum/contract
    name: EnergyRegistry
    network: polygon
    source:
      address: "0x0000000000000000000000000000000000000000" # Replace with deployed address
      abi: EnergyRegistry
      startBlock: 0 # Replace with deployment block
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - EV
        - Prosumer
        - Protocol
      abis:
        - name: EnergyRegistry
          file: ./abis/EnergyRegistry.json
      eventHandlers:
        - event: EVRegistered(indexed address,indexed bytes32,uint256,uint256,uint256)
          handler: handleEVRegistered
        - event: EVUpdated(indexed address,indexed bytes32,uint256)
          handler: handleEVUpdated
        - event: EVDeregistered(indexed address,indexed bytes32)
          handler: handleEVDeregistered
        - event: EnergyDeliveryRecorded(indexed bytes32,uint256,bool)
          handler: handleEnergyDeliveryRecorded
      file: ./src/energy-registry.ts
